set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 address 172.11.10.5/31
set / interface ethernet-1/3 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 address 172.11.10.3/31
set / interface system0 admin-state enable
set / interface system0 subinterface 0 ipv4 admin-state enable
set / interface system0 subinterface 0 ipv4 address 10.10.10.10/32
set / network-instance default type default
set / network-instance default admin-state enable
set / network-instance default interface ethernet-1/1.0
set / network-instance default interface ethernet-1/3.0
set / network-instance default interface system0.0
set / network-instance default protocols ospf instance local admin-state enable
set / network-instance default protocols ospf instance local version ospf-v2
set / network-instance default protocols ospf instance local router-id 10.10.10.10
set / network-instance default protocols ospf instance local area 0.0.0.0 interface ethernet-1/1.0 interface-type point-to-point
set / network-instance default protocols ospf instance local area 0.0.0.0 interface ethernet-1/3.0 interface-type point-to-point
set / network-instance default protocols ospf instance local area 0.0.0.0 interface system0.0 interface-type point-to-point
set / network-instance default protocols ospf instance local area 0.0.0.0 interface system0.0 passive true
