name: srl-evpn

mgmt:
  network: srl-evpn-lab-mgmt
  ipv4-subnet: 172.20.20.0/24
  ipv6-subnet: 2001:172:20:20::/64

prefix: ""
topology:
  defaults:
    kind: nokia_srlinux
  kinds:
    nokia_srlinux:
      type: ixr-d2l
      image: ghcr.io/nokia/srlinux:26.3.1
  nodes:
    leaf1:
      startup-config: configs/leaf1.cfg
      mgmt-ipv4: 172.20.20.2
      mgmt-ipv6: 2001:172:20:20::2
    leaf1-1:
      mgmt-ipv4: 172.20.20.5
      mgmt-ipv6: 2001:172:20:20::5
      startup-config: configs/leaf1-1.cfg
    leaf1-2:
      mgmt-ipv4: 172.20.20.6
      mgmt-ipv6: 2001:172:20:20::6
      startup-config: configs/leaf1-2.cfg
    spine:
      startup-config: configs/spine.cfg
      mgmt-ipv4: 172.20.20.3
      mgmt-ipv6: 2001:172:20:20::3
  links:
      # spine-leaf links
    - endpoints: ["leaf1:e1-1", "spine:e1-1"]
    - endpoints: ["leaf1-1:e1-3", "leaf1:e1-3"]
    - endpoints: ["leaf1-1:e1-1", "leaf1-2:e1-1"]
